<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="ryGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="ryShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0369A1" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Squiricle with Subtle Depth -->
  <rect width="128" height="128" rx="28" fill="url(#ryBg)" />
  <rect width="128" height="64" rx="28" fill="url(#ryGlass)" />
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35" />
  
  <!-- RY Monogram (Clean, Bold, High Legibility at 16px/32px/retina) -->
  <g filter="url(#ryShadow)" fill="#FFFFFF">
    <!-- Letter R -->
    <path d="M 26 26 L 64 26 C 78 26 87 34 87 46 C 87 56 79 63 68 66 L 88 102 L 70 102 L 53 74 L 44 74 L 44 102 L 26 102 Z M 44 41 L 44 59 L 62 59 C 68 59 72 56 72 50 C 72 44 68 41 62 41 Z" />
    <!-- Letter Y (Interlocking with R) -->
    <path d="M 68 58 L 82 80 L 96 58 L 112 58 L 91 87 L 91 102 L 75 102 L 75 87 L 55 58 Z" fill="#F0F9FF" />
  </g>
</svg>