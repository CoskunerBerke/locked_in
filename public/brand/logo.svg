<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Geometric Emblem -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#logoGradient)" />
    <path d="M12 28L20 12L28 28" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M16 22H24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <circle cx="20" cy="12" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Brand Typography -->
  <text x="62" y="32" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="20" fill="#0F172A" letter-spacing="1">
    MARKA ADI
  </text>
  <text x="63" y="46" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="9" fill="#0284C7" letter-spacing="2">
    DIGITAL SYSTEMS
  </text>
</svg>
