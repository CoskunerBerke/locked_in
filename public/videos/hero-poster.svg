<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="blueBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="glassSphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#E0F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <!-- Background Surface -->
  <rect width="1920" height="1080" fill="url(#heroBgGrad)" />

  <!-- Subtle Tech Grid -->
  <g opacity="0.15" stroke="#0284C7" stroke-width="1">
    <path d="M0 180H1920 M0 360H1920 M0 540H1920 M0 720H1920 M0 900H1920" />
    <path d="M320 0V1080 M640 0V1080 M960 0V1080 M1280 0V1080 M1600 0V1080" />
  </g>

  <!-- Glowing Digital Light Paths -->
  <path d="M960 200 C 1300 200, 1500 500, 1750 800" stroke="url(#blueBeam)" stroke-width="4" fill="none" opacity="0.6" />
  <path d="M1100 150 C 1400 300, 1600 450, 1800 650" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="10 15" />

  <!-- Floating Glass Spheres / Modules -->
  <circle cx="1400" cy="450" r="160" fill="url(#glassSphere)" filter="drop-shadow(0 20px 30px rgba(14,165,233,0.15))" />
  <rect x="1150" y="550" width="280" height="180" rx="20" fill="#FFFFFF" fill-opacity="0.7" stroke="#0EA5E9" stroke-width="2" opacity="0.8" />
  <rect x="1500" y="300" width="220" height="140" rx="16" fill="#FFFFFF" fill-opacity="0.6" stroke="#4F46E5" stroke-width="1.5" opacity="0.7" />

  <!-- Geometric Accents -->
  <circle cx="1400" cy="450" r="120" stroke="#0EA5E9" stroke-width="1.5" fill="none" stroke-dasharray="8 8" opacity="0.5" />
</svg>
